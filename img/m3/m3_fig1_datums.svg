<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Inter, Arial, sans-serif" font-size="13">
  <title>Eustasy, relative sea level and water depth at two moments (own schematic)</title>
  <rect width="640" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E293B"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#04316A"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E7B5A"/></marker>
  </defs>
  <!-- column t1: sea z=0 y=100; seafloor z=-10 y=180; datum z=-20 y=260 -->
  <g transform="translate(40,0)">
    <text x="120" y="40" text-anchor="middle" font-weight="700" fill="#04316A">Time t1</text>
    <rect x="0" y="100" width="240" height="80" fill="#D6E8F7"/>
    <rect x="0" y="180" width="240" height="80" fill="#EBDDB0"/>
    <rect x="0" y="260" width="240" height="100" fill="#D9D3C7"/>
    <line x1="0" y1="100" x2="240" y2="100" stroke="#04316A" stroke-width="2"/>
    <line x1="0" y1="180" x2="240" y2="180" stroke="#7A6A3A" stroke-width="1.5"/>
    <line x1="0" y1="260" x2="240" y2="260" stroke="#B03A2E" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="220" y="94" text-anchor="end" fill="#04316A">sea level</text>
    <text x="220" y="196" text-anchor="end" fill="#5B4C1F">sea floor</text>
    <text x="220" y="276" text-anchor="end" fill="#B03A2E">datum</text>
    <!-- W -->
    <line x1="40" y1="178" x2="40" y2="103" stroke="#1E7B5A" stroke-width="2.2" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
    <text x="48" y="145" fill="#1E7B5A" font-weight="600">W = 10 m</text>
    <!-- R -->
    <line x1="130" y1="258" x2="130" y2="103" stroke="#B03A2E" stroke-width="2.2" marker-end="url(#ahr)" marker-start="url(#ahr)"/>
    <text x="138" y="225" fill="#B03A2E" font-weight="600">R = 20 m</text>
    <!-- E -->
    <line x1="228" y1="398" x2="228" y2="103" stroke="#04316A" stroke-width="2.2" marker-end="url(#ahb)"/>
    <text x="220" y="320" fill="#04316A" font-weight="600" text-anchor="end">E</text>
  </g>
  <!-- column t2: sea z=-5 y=140; seafloor z=-16 y=228; datum z=-29 y=332 -->
  <g transform="translate(360,0)">
    <text x="120" y="40" text-anchor="middle" font-weight="700" fill="#04316A">Time t2 = t1 + 1 kyr</text>
    <line x1="0" y1="100" x2="240" y2="100" stroke="#04316A" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="4" y="94" fill="#64748B" font-size="11">sea level at t1</text>
    <rect x="0" y="140" width="240" height="88" fill="#D6E8F7"/>
    <rect x="0" y="228" width="240" height="24" fill="#F3E6A8"/>
    <rect x="0" y="252" width="240" height="80" fill="#EBDDB0"/>
    <rect x="0" y="332" width="240" height="28" fill="#D9D3C7"/>
    <line x1="0" y1="140" x2="240" y2="140" stroke="#04316A" stroke-width="2"/>
    <line x1="0" y1="228" x2="240" y2="228" stroke="#7A6A3A" stroke-width="1.5"/>
    <line x1="0" y1="252" x2="240" y2="252" stroke="#7A6A3A" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="0" y1="332" x2="240" y2="332" stroke="#B03A2E" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="220" y="134" text-anchor="end" fill="#04316A">sea level (fell 5 m)</text>
    <text x="220" y="244" text-anchor="end" fill="#5B4C1F" font-size="11">new sediment, 3 m</text>
    <text x="220" y="348" text-anchor="end" fill="#B03A2E">datum (subsided 9 m)</text>
    <line x1="40" y1="226" x2="40" y2="143" stroke="#1E7B5A" stroke-width="2.2" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
    <text x="48" y="190" fill="#1E7B5A" font-weight="600">W = 11 m</text>
    <line x1="130" y1="330" x2="130" y2="143" stroke="#B03A2E" stroke-width="2.2" marker-end="url(#ahr)" marker-start="url(#ahr)"/>
    <text x="138" y="300" fill="#B03A2E" font-weight="600">R = 24 m</text>
    <line x1="228" y1="398" x2="228" y2="143" stroke="#04316A" stroke-width="2.2" marker-end="url(#ahb)"/>
    <text x="220" y="390" fill="#04316A" font-weight="600" text-anchor="end">E</text>
  </g>
  <!-- centre of Earth marker -->
  <line x1="30" y1="400" x2="610" y2="400" stroke="#1E293B" stroke-width="1"/>
  <text x="320" y="418" text-anchor="middle" fill="#1E293B" font-size="12">E is measured from the centre of the Earth (axis broken; not to scale)</text>
  <path d="M260,384 l8,-6 l8,6" fill="none" stroke="#1E293B"/>
  <path d="M580,384 l8,-6 l8,6" fill="none" stroke="#1E293B"/>
</svg>
