<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="Inter, Arial, sans-serif" font-size="13">
  <title>Same eustatic fall, differential subsidence: relative fall landward, relative rise basinward (own schematic)</title>
  <rect width="680" height="470" fill="#ffffff"/>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E293B"/></marker>
    <marker id="db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#04316A"/></marker>
  </defs>
  <!-- Upper graph: x 80..620 ; R from -2 (left) to +3 (right); y scale: 0 at y=120, 20 px per m/kyr -->
  <text x="80" y="24" font-weight="700" fill="#04316A">Rate of relative sea-level change along the profile, R = E + T</text>
  <line x1="80" y1="40" x2="80" y2="190" stroke="#1E293B"/>
  <line x1="80" y1="120" x2="620" y2="120" stroke="#1E293B"/>
  <text x="72" y="64" text-anchor="end" font-size="11">+3</text>
  <text x="72" y="124" text-anchor="end" font-size="11">0</text>
  <text x="72" y="164" text-anchor="end" font-size="11">−2</text>
  <line x1="76" y1="60" x2="80" y2="60" stroke="#1E293B"/><line x1="76" y1="160" x2="80" y2="160" stroke="#1E293B"/>
  <text x="30" y="110" font-size="11" transform="rotate(-90 30 110)" text-anchor="middle">m/kyr</text>
  <polygon points="80,120 80,160 296,120" fill="#F5C6C0"/>
  <polygon points="296,120 620,60 620,120" fill="#C9DDF2"/>
  <line x1="80" y1="160" x2="620" y2="60" stroke="#04316A" stroke-width="2.5"/>
  <text x="110" y="182" fill="#B03A2E" font-weight="600">relative fall (forced regression possible)</text>
  <text x="430" y="110" fill="#04316A" font-weight="600">relative rise</text>
  <line x1="296" y1="40" x2="296" y2="420" stroke="#64748B" stroke-dasharray="5 4"/>
  <text x="300" y="52" fill="#334155" font-size="12">hinge: T = |E|, R = 0</text>
  <!-- Lower cross-section: land left, basin right -->
  <text x="80" y="226" font-weight="700" fill="#04316A">Cross-section (extensional margin; subsidence increases basinward)</text>
  <rect x="200" y="262" width="420" height="80" fill="#D6E8F7"/>
  <path d="M80,250 L200,262 C300,280 450,310 620,330 L620,400 L80,400 Z" fill="#EBDDB0" stroke="#7A6A3A" stroke-width="1.5"/>
  <line x1="200" y1="262" x2="620" y2="262" stroke="#04316A" stroke-width="2"/>
  <text x="616" y="256" text-anchor="end" fill="#04316A" font-size="12">sea level: same eustatic fall E = −3 m/kyr everywhere</text>
  <line x1="450" y1="268" x2="450" y2="290" stroke="#04316A" stroke-width="2" marker-end="url(#db)"/>
  <line x1="250" y1="268" x2="250" y2="290" stroke="#04316A" stroke-width="2" marker-end="url(#db)"/>
  <!-- subsidence arrows increasing length -->
  <g stroke="#1E293B" stroke-width="2" marker-end="url(#d)">
    <line x1="110" y1="404" x2="110" y2="414"/>
    <line x1="200" y1="404" x2="200" y2="420"/>
    <line x1="296" y1="404" x2="296" y2="428"/>
    <line x1="400" y1="404" x2="400" y2="436"/>
    <line x1="510" y1="404" x2="510" y2="444"/>
    <line x1="610" y1="404" x2="610" y2="452"/>
  </g>
  <text x="104" y="412" text-anchor="end" font-size="11">T = 1</text>
  <text x="604" y="466" text-anchor="end" font-size="11">T = 6 m/kyr (subsidence)</text>
  <text x="100" y="244" font-size="11" fill="#334155">land</text>
  <text x="560" y="372" font-size="11" fill="#334155">basin</text>
</svg>
